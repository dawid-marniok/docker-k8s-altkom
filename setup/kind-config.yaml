# Lokalny klaster na szkolenie: 1 control plane + 2 workery, porty 80/443 z laptopa do klastra (Ingress).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: szkolenie
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
