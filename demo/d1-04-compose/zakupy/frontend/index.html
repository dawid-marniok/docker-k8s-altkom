<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista zakupów</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; --line: #e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    input[name=name] { flex: 1; min-width: 0; }
    input[name=quantity] { width: 70px; }
    input[name=unit] { width: 70px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    li.bought .name { text-decoration: line-through; color: var(--muted); }
    .name { flex: 1; }
    .qty { color: var(--muted); font-size: .9rem; }
    .del { background: none; color: var(--muted); padding: 4px 8px; }
    .empty { padding: 16px; color: var(--muted); }
    .error { color: #b91c1c; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Lista zakupów</h1>
  <div class="meta" id="meta">łączę z API…</div>

  <form id="add">
    <input name="name" placeholder="Co kupić?" required>
    <input name="quantity" type="number" step="any" min="0" value="1">
    <input name="unit" value="szt.">
    <button>Dodaj</button>
  </form>

  <ul id="list"></ul>
  <div class="error" id="error"></div>
</main>

<script>
  // Wszystkie zapytania idą do /api/..., a nginx przekazuje je do usługi api.
  const api = (path, opts = {}) =>
    fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts })
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.status === 204 ? null : r.json(); });

  const list = document.getElementById('list');
  const errorBox = document.getElementById('error');

  function showError(e) { errorBox.textContent = 'Błąd: ' + e.message; }

  async function load() {
    try {
      const [info, items] = await Promise.all([api('/'), api('/items')]);
      document.getElementById('meta').textContent = `API: kontener ${info.host} · pozycji: ${info.items}`;
      errorBox.textContent = '';
      list.innerHTML = '';
      if (!items.length) list.innerHTML = '<li class="empty">Lista jest pusta.</li>';
      for (const item of items) {
        const li = document.createElement('li');
        li.className = item.bought ? 'bought' : '';
        li.innerHTML = `<input type="checkbox" ${item.bought ? 'checked' : ''}>
          <span class="name"></span><span class="qty">${item.quantity} ${item.unit}</span>
          <button class="del" title="Usuń">✕</button>`;
        li.querySelector('.name').textContent = item.name;
        li.querySelector('input').onchange = e =>
          api(`/items/${item.id}`, { method: 'PUT', body: JSON.stringify({ bought: e.target.checked }) }).then(load, showError);
        li.querySelector('.del').onclick = () =>
          api(`/items/${item.id}`, { method: 'DELETE' }).then(load, showError);
        list.appendChild(li);
      }
    } catch (e) { showError(e); }
  }

  document.getElementById('add').onsubmit = e => {
    e.preventDefault();
    const f = e.target.elements;
    api('/items', { method: 'POST', body: JSON.stringify({
      name: f.name.value, quantity: Number(f.quantity.value) || 1, unit: f.unit.value || 'szt.'
    }) }).then(() => { f.name.value = ''; f.name.focus(); load(); }, showError);
  };

  load();
</script>
</body>
</html>
