# Lista zakupów: frontend (nginx) -> API (Flask) -> PostgreSQL, plus pgAdmin.
name: zakupy

services:
  frontend:
    image: nginx:1.29
    ports:
      - "${FRONTEND_PORT}:80"           # jedyne wejście do aplikacji
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - front
    restart: unless-stopped

  api:
    build: ./app                        # obraz budowany z app/Dockerfile
    image: zakupy-api:1.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_DEBUG: "1"                  # przeładowanie po zmianie kodu
    volumes:
      - ./app:/app                      # bind mount: kod z dysku, bez przebudowy obrazu
    depends_on:
      db:
        condition: service_healthy      # start dopiero, gdy baza odpowiada
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 10s
      timeout: 3s
      retries: 3
    networks:                           # brak ports: API widać tylko przez frontend
      - front
      - back
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dane:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - back
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"                # bez logowania (tylko lokalnie!)
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro # serwer "db" już dodany
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back

networks:
  front:                                # frontend <-> api
  back:                                 # api, pgadmin <-> db

volumes:
  dane:
