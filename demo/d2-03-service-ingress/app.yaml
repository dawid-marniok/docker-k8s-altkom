# Trzy repliki aplikacji, która odpowiada swoją nazwą hosta i nagłówkami żądania, oraz Service przed nimi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kto
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kto
  template:
    metadata:
      labels:
        app: kto
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kto
spec:
  selector:
    app: kto
  ports:
    - port: 80
      targetPort: 80
