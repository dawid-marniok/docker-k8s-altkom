# Aplikacja, która przy każdym żądaniu chwilę liczy — dobra do pokazania HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liczydlo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liczydlo
  template:
    metadata:
      labels:
        app: liczydlo
    spec:
      containers:
        - name: app
          image: python:3.13-alpine
          command: ["python", "-c"]
          args:
            - |
              import socket
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      sum(i * i for i in range(300_000))
                      self.send_response(200); self.end_headers()
                      self.wfile.write(f"policzone na {socket.gethostname()}\n".encode())
                  def log_message(self, *a):
                      pass
              ThreadingHTTPServer(("", 8080), H).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liczydlo
spec:
  selector:
    app: liczydlo
  ports:
    - port: 80
      targetPort: 8080
