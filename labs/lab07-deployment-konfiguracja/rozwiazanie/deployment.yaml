# Lab07 po kroku 6: Deployment z ConfigMap i Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:0.3-plain-text
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: hello-config
            - secretRef:
                name: hello-secret
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
