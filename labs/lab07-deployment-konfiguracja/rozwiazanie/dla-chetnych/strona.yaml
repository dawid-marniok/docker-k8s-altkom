# Lab07 dla chętnych: ConfigMap jako plik w wolumenie
apiVersion: v1
kind: ConfigMap
metadata:
  name: strona
data:
  index.html: |
    <h1>Strona z ConfigMap</h1>
    <p>Ten plik nie jest w obrazie, tylko w obiekcie ConfigMap.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strona
  labels:
    app: strona
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strona
  template:
    metadata:
      labels:
        app: strona
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80
          volumeMounts:
            - name: strona
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: strona
          configMap:
            name: strona
