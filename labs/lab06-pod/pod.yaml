apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
    env: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.29
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
