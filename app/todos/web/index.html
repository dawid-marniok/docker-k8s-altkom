<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDos</title>
  <style>
    :root { --ink: #14213d; --acc: #e4572e; --bg: #f6f4f0; --line: #ddd6cc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 4px; font-size: 32px; }
    #info { color: #666; font-size: 13px; margin-bottom: 24px; min-height: 1em; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; }
    button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);
         border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { background: transparent; color: var(--acc); padding: 4px 8px; }
    #error { color: var(--acc); min-height: 1.2em; }
  </style>
</head>
<body>
<main>
  <h1>ToDos</h1>
  <div id="info"></div>
  <form id="form">
    <input id="title" placeholder="Co jest do zrobienia?" autocomplete="off" required>
    <button>Dodaj</button>
  </form>
  <div id="error"></div>
  <ul id="list"></ul>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const api = (path, opts = {}) =>
    fetch("/api" + path, { headers: { "Content-Type": "application/json" }, ...opts });

  async function load() {
    try {
      const info = await (await api("/info")).json();
      $("info").textContent = `API ${info.version} · odpowiada: ${info.host} · baza: ${info.db}`;
      const r = await api("/todos");
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      const items = await r.json();
      $("list").innerHTML = "";
      for (const t of items) {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.done;
        cb.onchange = async () => { await api("/todos/" + t._id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }); load(); };
        const span = document.createElement("span"); span.textContent = t.title;
        const del = document.createElement("button"); del.textContent = "usuń";
        del.onclick = async () => { await api("/todos/" + t._id, { method: "DELETE" }); load(); };
        li.append(cb, span, del);
        $("list").append(li);
      }
      $("error").textContent = "";
    } catch (e) {
      $("error").textContent = "Brak połączenia z API: " + e.message;
    }
  }

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    await api("/todos", { method: "POST", body: JSON.stringify({ title: $("title").value }) });
    $("title").value = "";
    load();
  };
  load();
</script>
</body>
</html>
